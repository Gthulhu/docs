<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Decode Throughput Under CPU Pressure</title>
  <desc id="desc">Bar chart comparing baseline Linux scheduling, Gthulhu without policy, and Gthulhu with workload policy for tg64, tg128, and peak decode throughput.</desc>
  <rect width="900" height="520" fill="white"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">vLLM Decode Throughput Under CPU Pressure</text>
  <text x="450" y="70" text-anchor="middle" font-family="sans-serif" font-size="14">DGX Spark / GB10 · Qwen2.5-0.5B · higher is better</text>
  <line x1="90" y1="430" x2="850" y2="430" stroke="#444"/>
  <line x1="90" y1="110" x2="90" y2="430" stroke="#444"/>
  <g font-family="sans-serif" font-size="12" fill="#444">
    <text x="70" y="434" text-anchor="end">0</text>
    <text x="70" y="381" text-anchor="end">5</text>
    <text x="70" y="328" text-anchor="end">10</text>
    <text x="70" y="275" text-anchor="end">15</text>
    <text x="70" y="222" text-anchor="end">20</text>
    <text x="70" y="169" text-anchor="end">25</text>
    <text x="70" y="116" text-anchor="end">30</text>
  </g>
  <g stroke="#ddd">
    <line x1="90" y1="377" x2="850" y2="377"/>
    <line x1="90" y1="324" x2="850" y2="324"/>
    <line x1="90" y1="271" x2="850" y2="271"/>
    <line x1="90" y1="218" x2="850" y2="218"/>
    <line x1="90" y1="165" x2="850" y2="165"/>
    <line x1="90" y1="112" x2="850" y2="112"/>
  </g>
  <g>
    <rect x="145" y="360" width="45" height="70" fill="#6c757d"/><rect x="195" y="225" width="45" height="205" fill="#4f7cac"/><rect x="245" y="241" width="45" height="189" fill="#2a9d8f"/>
    <rect x="375" y="359" width="45" height="71" fill="#6c757d"/><rect x="425" y="244" width="45" height="186" fill="#4f7cac"/><rect x="475" y="204" width="45" height="226" fill="#2a9d8f"/>
    <rect x="605" y="287" width="45" height="143" fill="#6c757d"/><rect x="655" y="130" width="45" height="300" fill="#4f7cac"/><rect x="705" y="119" width="45" height="311" fill="#2a9d8f"/>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="217" y="462">tg64</text><text x="447" y="462">tg128</text><text x="677" y="462">peak decode</text>
    <text x="167" y="351">6.6</text><text x="217" y="216">19.3</text><text x="267" y="232">17.8</text>
    <text x="397" y="350">6.7</text><text x="447" y="235">17.5</text><text x="497" y="195">21.3</text>
    <text x="627" y="278">13.5</text><text x="677" y="121">28.3</text><text x="727" y="110">29.3</text>
  </g>
  <g font-family="sans-serif" font-size="13">
    <rect x="230" y="486" width="14" height="14" fill="#6c757d"/><text x="250" y="498">Default + contention</text>
    <rect x="410" y="486" width="14" height="14" fill="#4f7cac"/><text x="430" y="498">Gthulhu</text>
    <rect x="520" y="486" width="14" height="14" fill="#2a9d8f"/><text x="540" y="498">Gthulhu + policy</text>
  </g>
  <text x="26" y="270" transform="rotate(-90 26 270)" text-anchor="middle" font-family="sans-serif" font-size="14">tokens / second</text>
</svg>
